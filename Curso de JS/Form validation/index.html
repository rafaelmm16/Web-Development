<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Validação de Formulário - JavaScript</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      color: #f8fafc;
      padding: 20px;
    }

    .card {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(16px);
      padding: 2.5rem;
      border-radius: 1.25rem;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
    }

    .badge {
      display: inline-block;
      padding: 0.35rem 0.75rem;
      background: rgba(99, 102, 241, 0.2);
      color: #a5b4fc;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 1rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: #fff;
    }

    p.subtitle {
      color: #94a3b8;
      font-size: 0.95rem;
      margin-bottom: 1.75rem;
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      font-size: 0.9rem;
      font-weight: 500;
      margin-bottom: 0.5rem;
      color: #cbd5e1;
    }

    input[type="text"] {
      width: 100%;
      padding: 0.85rem 1rem;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 0.75rem;
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: all 0.2s ease;
    }

    input[type="text"]:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
    }

    .btn-submit {
      width: 100%;
      padding: 0.9rem;
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      border: none;
      border-radius: 0.75rem;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.5);
    }

    .btn-submit:active {
      transform: translateY(0);
    }

    .feedback {
      margin-top: 1.25rem;
      padding: 0.85rem 1rem;
      border-radius: 0.75rem;
      font-size: 0.9rem;
      display: none;
      animation: fadeIn 0.3s ease;
    }

    .feedback.error {
      display: block;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
    }

    .feedback.success {
      display: block;
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: #86efac;
    }

    .back-home {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 1.5rem;
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.875rem;
      transition: color 0.2s ease;
    }

    .back-home:hover {
      color: #ffffff;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-5px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="card">
    <span class="badge">Curso de JavaScript</span>
    <h1>Validação de Formulário</h1>
    <p class="subtitle">Exemplo prático de validação de campos usando JavaScript Vanilla.</p>

    <form id="form-exemplo" onsubmit="return handleValidate(event)">
      <div class="form-group">
        <label for="nome">Nome Completo</label>
        <input type="text" name="nome" id="nome" placeholder="Insira seu nome aqui">
      </div>
      <button type="submit" class="btn-submit">Validar e Enviar</button>
      <div id="feedback" class="feedback"></div>
    </form>

    <a href="../../index.html" class="back-home">
      ← Voltar para o Hub de Projetos
    </a>
  </div>

  <script src="script.js"></script>
  <script>
    function handleValidate(e) {
      e.preventDefault();
      const feedback = document.getElementById('feedback');
      const nome = document.getElementById('nome');

      if (!nome.value.trim()) {
        feedback.className = 'feedback error';
        feedback.textContent = '❌ Campo nome não pode estar em branco.';
      } else {
        feedback.className = 'feedback success';
        feedback.textContent = `✅ Olá, ${nome.value.trim()}! Nenhum problema detectado. Formulário enviado com sucesso.`;
      }
      return false;
    }
  </script>
</body>
</html>
